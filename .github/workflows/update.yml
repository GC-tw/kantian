# 看天爬山：自動抓資料、更新網站（2026-10-22 使用者決定）
# 平常每 3 小時一次（台灣 00:07、03:07…21:07，包含氣象署約 05:30、11:30、17:30、23:30 發布後的那一次）；
# 有颱風警報或豪雨、大雨特報時，其他整點也更新（等於每小時）。以下時間為 UTC（台灣時間減 8 小時）
name: 更新天氣資料

on:
  schedule:
    - cron: '7 1-22/3 * * *'                                # 台灣 09:07、12:07…06:07（每 3 小時，一定更新）
    - cron: '7 0,2,3,5,6,8,9,11,12,14,15,17,18,20,21,23 * * *'   # 其他整點：只在有特報時更新
  workflow_dispatch: {}    # 也可以在 GitHub 上手動按「Run workflow」（會重新抓資料）
  push:                    # 只改網頁時：沿用網站上最新的天氣資料（較快）；改到山岳資料或抓資料程式時：自動重新抓資料
    branches: [main]
    paths: ['site/**', 'scripts/**', 'data/mountains.json']

permissions:
  contents: write          # 存回資料集代碼與格式樣本
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 其他整點的排程：看最近一次的執行紀錄，有颱風警報或豪雨、大雨特報（還沒過期）才更新
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: data/last-run.json
          sparse-checkout-cone-mode: false
      - id: c
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "7 1-22/3 * * *" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "每 3 小時的更新"; exit 0
          fi
          node -e "
            let r = {}; try { r = require('./data/last-run.json'); } catch {}
            const s = r.summary || {}, now = Date.now();
            const al = (s.alerts || []).filter(a => /颱風|豪雨|大雨/.test(a.type) && (a.end == null || a.end > now));
            const ty = (s.typhoons || []).some(t => t.warn);
            const failed = r.ok !== true;   // 上一次失敗（例如氣象署連線逾時）時紀錄是空的，也照常更新＝下個整點自動重試（2026-10-22）
            const go = al.length > 0 || ty || failed;
            console.log(failed ? '上一次更新失敗，這次重試' : go ? '有特報，這次更新：' + [...new Set(al.map(a => a.type))].join('、') + (ty ? '（颱風警報）' : '') : '沒有特報，這次略過');
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'go=' + go + '\\n');
          "
  update:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20       # 最多 20 分鐘，避免卡住
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0           # 需要歷史紀錄，才能比對這次 push 改了哪些檔案
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false   # 不使用套件快取
      - name: 沿用最新天氣資料（只在修改網頁時）
        id: reuse
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          # 改到山岳資料、抓資料程式或共用的風級表：一定重新抓資料
          if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > "$RUNNER_TEMP/changed.txt" 2>/dev/null || grep -qE '^(data/mountains\.json|scripts/fetch\.mjs|site/beaufort\.mjs)$' "$RUNNER_TEMP/changed.txt"; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "改到資料或抓資料程式，重新抓取"; exit 0
          fi
          url="https://$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z').github.io/${{ github.event.repository.name }}/forecast.json"
          # 下載成功且資料在 9 小時內才沿用，否則改為重新抓取
          if curl -fsSL "$url" -o dist/forecast.json && node -e "const f=require('./dist/forecast.json'); process.exit(Date.now()-Date.parse(f.fetchedAt) < 9*3600e3 ? 0 : 1)"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "沿用 $url"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "無法沿用，改為重新抓取"
          fi
      - name: 抓取氣象署資料
        if: steps.reuse.outputs.ok != 'true'
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: node scripts/fetch.mjs --out dist/forecast.json
      - name: 產生網頁
        run: node scripts/build.mjs
      - name: 存回資料集代碼與格式樣本（只在有變動時，抓取失敗也會存）
        if: always() && steps.reuse.outputs.ok != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "資料沒有變動，不存回"
            exit 0
          fi
          git commit -m "更新執行紀錄、資料集代碼與格式樣本"
          # 重跑時 checkout 會把本地的 origin/main 指回這次執行當初的 commit，
          # main 若已經往前，直接 push 會被拒。每次推之前都重新抓遠端真正的 main，
          # 把這次的資料 commit 接上去再推；被拒（main 又往前）就重試。
          # 資料檔撞到時採用這次執行寫出的版本；程式檔有衝突就停止。不使用 --force。
          pushlog="${RUNNER_TEMP:-/tmp}/push-err.txt"
          for i in 1 2 3 4; do
            if ! git fetch origin +refs/heads/main:refs/remotes/origin/main; then
              echo "抓不到遠端 main，稍後重試（第 ${i} 次）"
              sleep $((i * 2))
              continue
            fi
            if ! git rebase --empty=drop origin/main; then
              conflicted="$(git diff --name-only --diff-filter=U || true)"
              printf '%s\n' "$conflicted"
              if [ -z "$conflicted" ] || printf '%s\n' "$conflicted" | grep -qv '^data/'; then
                echo "接上 main 失敗（資料檔以外有衝突，或不是衝突造成的），停止推送"
                git rebase --abort || true
                exit 1
              fi
              echo "資料檔有衝突，採用這次執行寫出的版本"
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                git checkout --theirs -- "$f" || git rm -f -- "$f"
                git add -A -- "$f"
              done <<< "$conflicted"
              if git diff --cached --quiet && git diff --quiet; then
                git rebase --skip
              else
                GIT_EDITOR=true git rebase --continue
              fi
            fi
            if git push origin HEAD:main >"$pushlog" 2>&1; then
              cat "$pushlog"
              exit 0
            fi
            cat "$pushlog"
            if ! grep -qE 'non-fast-forward|fetch first|\[rejected\]|Updates were rejected' "$pushlog"; then
              echo "推送失敗，不是 main 往前造成的，不再重試"
              exit 1
            fi
            echo "推送被拒，接上最新的 main 後重試（第 ${i} 次）"
            sleep $((i * 2))
          done
          echo "存回資料失敗：推不上 main"
          exit 1
      # 不使用 enablement：這個選項不能用工作流程自帶的 GITHUB_TOKEN（開 Pages 要另外的管理權限）。
      # Pages 要在專案 Settings → Pages → Source 選 GitHub Actions，手動開一次。
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
      # 部分失敗也通知（2026-10-21 使用者決定）：網站照常更新後，如果這次抓資料有警告（例如某縣市資料沒抓到），
      # 讓這次執行顯示失敗（紅色叉叉），GitHub 就會寄通知信給你；警告內容寫在執行紀錄與 data/last-run.json
      - name: 檢查有沒有部分失敗（有就寄通知信）
        if: steps.reuse.outputs.ok != 'true'
        run: |
          node -e "const r=require('./data/last-run.json'); const w=r.warnings||[]; w.forEach(m=>console.log('::error::'+m)); if(w.length){console.log('網站已更新，但有 '+w.length+' 則警告'); process.exit(1)}"
