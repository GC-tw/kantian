# 看天爬山：每天在氣象署發布後自動抓資料、更新網站
# 氣象署約在 05:30、11:30、17:30、23:30（台灣時間）發布；以下時間為 UTC（台灣時間減 8 小時），排在發布後約 30 分鐘
name: 更新天氣資料

on:
  schedule:
    - cron: '7 22 * * *'   # 台灣 06:07
    - cron: '7 4 * * *'    # 台灣 12:07
    - cron: '7 10 * * *'   # 台灣 18:07
    - cron: '7 16 * * *'   # 台灣 00:07
  workflow_dispatch: {}    # 也可以在 GitHub 上手動按「Run workflow」（會重新抓資料）
  push:                    # 只改網頁時：沿用網站上最新的天氣資料（較快）；改到山岳資料或抓資料程式時：自動重新抓資料
    branches: [main]
    paths: ['site/**', 'scripts/**', 'data/mountains.json']

permissions:
  contents: write          # 存回資料集代碼與格式樣本
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20       # 最多 20 分鐘，避免卡住
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0           # 需要歷史紀錄，才能比對這次 push 改了哪些檔案
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false   # 不使用套件快取
      - name: 沿用最新天氣資料（只在修改網頁時）
        id: reuse
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          # 改到山岳資料、抓資料程式或共用的風級表：一定重新抓資料
          if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > "$RUNNER_TEMP/changed.txt" 2>/dev/null || grep -qE '^(data/mountains\.json|scripts/fetch\.mjs|site/beaufort\.mjs)$' "$RUNNER_TEMP/changed.txt"; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "改到資料或抓資料程式，重新抓取"; exit 0
          fi
          url="https://$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z').github.io/${{ github.event.repository.name }}/forecast.json"
          # 下載成功且資料在 9 小時內才沿用，否則改為重新抓取
          if curl -fsSL "$url" -o dist/forecast.json && node -e "const f=require('./dist/forecast.json'); process.exit(Date.now()-Date.parse(f.fetchedAt) < 9*3600e3 ? 0 : 1)"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "沿用 $url"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "無法沿用，改為重新抓取"
          fi
      - name: 抓取氣象署資料
        if: steps.reuse.outputs.ok != 'true'
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: node scripts/fetch.mjs --out dist/forecast.json
      - name: 產生網頁
        run: node scripts/build.mjs
      - name: 存回資料集代碼與格式樣本（只在有變動時，抓取失敗也會存）
        if: always() && steps.reuse.outputs.ok != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "更新執行紀錄、資料集代碼與格式樣本" && git push)
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
